<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Cart - 매장 안내</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="store">
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <button
            class="back-btn"
            onclick="history.back()"
            aria-label="뒤로가기"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="title-group">
            <h1>매장 안내</h1>
            <p data-tts-sub>상품의 위치까지 길을 안내해 드려요.</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="pill-btn font-toggle-btn">가+ 글자 크게</button>
          <button class="icon-btn tts-btn" aria-label="읽어주기">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="store-layout">
        <div>
          <div class="card store-product-card" id="productCard"></div>
          <div class="card loc-block" id="locBlock"></div>
          <div class="card direction-list" id="directionList"></div>
          <button class="go-btn" id="goBtn">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="3 11 22 2 13 21 11 13 3 11" />
            </svg>
            길 안내 시작하기
          </button>
        </div>
        <div>
          <div class="floor-tabs" id="floorTabs">
            <button data-floor="f1" class="active">1층 식품관</button>
            <button data-floor="f2">2층 생활용품관</button>
            <button data-floor="f3">3층 기타</button>
          </div>
          <div class="store-map">
            <div class="map-grid" id="mapGrid"></div>
            <div class="current-loc">📍 현재 위치</div>
          </div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a class="nav-btn" href="index.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        홈
      </a>
      <a class="nav-btn" href="checklist.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3" y1="6" x2="3.01" y2="6" />
          <line x1="3" y1="12" x2="3.01" y2="12" />
          <line x1="3" y1="18" x2="3.01" y2="18" />
        </svg>
        리스트
      </a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/common.js"></script>
    <script>
      const FLOOR_ZONES = {
        f1: [
          "채소·과일",
          "육류·수산",
          "냉동식품",
          "가공식품",
          "음료·간식",
          "유제품",
          "냉장식품 코너",
          "베이커리 코너",
        ],
        f2: ["생활용품 코너", "주방용품", "뷰티", "문구"],
        f3: ["기타 상품"],
      };
      const ZONE_EMOJI = {
        "채소·과일": "🥦",
        "육류·수산": "🐟",
        냉동식품: "🧊",
        가공식품: "🥫",
        "음료·간식": "🍪",
        유제품: "🥛",
        "냉장식품 코너": "🧀",
        "베이커리 코너": "🍞",
        "생활용품 코너": "🧴",
        주방용품: "🍳",
        뷰티: "💄",
        문구: "✏️",
        "기타 상품": "📦",
      };

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "milk_seoul";
      const product = getProduct(id) || PRODUCTS[0];
      let currentFloor = product.location.floor;

      document.getElementById("productCard").innerHTML = `
    <div class="product-thumb">${product.emoji}</div>
    <div>
      <h4>${product.name}</h4>
      <div class="product-meta">${product.volume}</div>
      <div class="product-price">${formatPrice(product.price)}</div>
      <div class="product-rating">★ ${product.rating} (${product.reviews.toLocaleString("ko-KR")})</div>
    </div>
  `;

      document.getElementById("locBlock").innerHTML = `
    <h3>상품 위치</h3>
    <div class="loc-pin">
      📍
      <span>${product.location.zone}<small>${product.location.detail}</small></span>
    </div>
  `;

      document.getElementById("directionList").innerHTML = `
    <h3>가는 길 안내</h3>
    <div class="direction-step"><div class="num">1</div><p>현재 위치에서 앞으로 직진해주세요.</p></div>
    <div class="direction-step"><div class="num">2</div><p>${product.location.detail.split(" · ")[0]}로 이동하세요.</p></div>
    <div class="direction-step"><div class="num">3</div><p>${product.location.zone}로 들어가세요.</p></div>
    <div class="direction-step"><div class="num">4</div><p>${product.location.detail.split(" · ")[1] || ""}에서 상품을 찾아보세요.</p></div>
  `;

      document.getElementById("goBtn").addEventListener("click", () => {
        alert(
          "🧭 길 안내를 시작합니다. 카트가 " +
            product.location.zone +
            "까지 안내해 드려요.",
        );
      });

      function renderMap() {
        document.querySelectorAll("#floorTabs button").forEach((b) => {
          b.classList.toggle("active", b.dataset.floor === currentFloor);
        });
        const zones = FLOOR_ZONES[currentFloor];
        const grid = document.getElementById("mapGrid");
        grid.innerHTML = "";
        zones.forEach((zoneName, i) => {
          const div = document.createElement("div");
          const isTarget =
            currentFloor === product.location.floor &&
            zoneName === product.location.zone;
          const colors = [
            "#d9ead0",
            "#f6d6d2",
            "#cfe3f0",
            "#f3dfc2",
            "#e6d5ef",
            "#cfe8e0",
          ];
          div.className = "map-zone" + (isTarget ? " target" : "");
          if (!isTarget) div.style.background = colors[i % colors.length];
          div.innerHTML = `${ZONE_EMOJI[zoneName] || "📦"} ${zoneName}`;
          grid.appendChild(div);
        });
      }

      document.querySelectorAll("#floorTabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentFloor = btn.dataset.floor;
          renderMap();
        });
      });

      renderMap();
    </script>
  </body>
</html>

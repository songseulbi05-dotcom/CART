<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cart - 상품 찾기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
<div class="device-frame">
<div class="page">

  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="history.back()" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-group">
        <h1>상품 찾기</h1>
        <p data-tts-sub>원하는 상품을 검색하거나, 음성으로 말씀해보세요.</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="pill-btn font-toggle-btn">가+ 글자 크게</button>
      <button class="icon-btn tts-btn" aria-label="읽어주기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>
  </div>

  <form class="card search-box" id="searchForm">
    <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="찾는 상품을 말씀하거나 입력하세요." autocomplete="off">
    <button type="button" class="mic-circle" id="searchMic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
  </form>

  <div class="section-head">
    <h2>자주 찾는 상품</h2>
    <a class="link" href="result.html?cat=all">전체 보기 ></a>
  </div>
  <div class="cat-grid" id="catGrid"></div>

  <div class="section-head">
    <h2>최근 검색어</h2>
    <button class="link" id="clearRecentBtn" style="border:none;background:none;display:flex;align-items:center;gap:4px;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      전체삭제
    </button>
  </div>
  <div class="recent-row" id="recentRow"></div>

</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    홈
  </a>
  <a class="nav-btn" href="checklist.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    리스트
  </a>
</nav>
</div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
  const CAT_ICONS = {
    veg: `<circle cx="20" cy="22" r="13" fill="#5CA850"/><circle cx="14" cy="16" r="6" fill="#6FBE62"/><circle cx="24" cy="14" r="6" fill="#6FBE62"/><circle cx="37" cy="30" r="11" fill="#E2574C"/><rect x="34" y="16" width="6" height="8" rx="2" fill="#5CA850" transform="rotate(20 34 16)"/><rect x="18" y="38" width="16" height="7" rx="3.5" fill="#F4C84B"/>`,
    meat: `<path d="M12 34c-3-3-3-9 2-13 5-4 12-5 17-1 4 3 5 9 2 13-4 5-16 6-21 1z" fill="#D97B6C"/><circle cx="33" cy="15" r="6" fill="#E8C86A"/><path d="M38 32c6 2 10 8 8 12-2 3-9 2-13-3-3-4-2-10 5-9z" fill="#6FA8C8"/><path d="M38 32l6 10M41 30l6 9" stroke="#4A85A8" stroke-width="2" stroke-linecap="round"/>`,
    dairy: `<path d="M16 10h12l2 6v24a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V16z" fill="#7BB8E8"/><path d="M16 10l6-6 6 6z" fill="#5A9BD4"/><rect x="14" y="20" width="16" height="4" fill="#fff" opacity=".6"/><path d="M33 28c4-2 9 0 9 5v9a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3v-9c0-2 1-4 3-5z" fill="#F4C84B"/>`,
    health: `<rect x="16" y="14" width="16" height="28" rx="6" fill="#F2F5F2" stroke="#6FA878" stroke-width="2"/><rect x="16" y="14" width="16" height="9" rx="4" fill="#6FA878"/><circle cx="24" cy="32" r="4" fill="#E2574C"/><path d="M37 14c5 2 8 8 5 13-2 4-7 5-10 2-3-3-2-9 2-12z" fill="#7BBE6E"/><path d="M38 16c-2 4-2 8 0 11" stroke="#4E8A47" stroke-width="1.6" stroke-linecap="round" fill="none"/>`,
    processed: `<path d="M14 20h18l-2 18a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3z" fill="#F2F4EC"/><path d="M12 20h22l1-4H11z" fill="#E2574C"/><path d="M18 24c2 3 2 6 0 9M23 24c2 3 2 6 0 9M28 24c2 3 2 6 0 9" stroke="#E8C86A" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="37" cy="33" r="9" fill="#8FA9C8"/><rect x="33" y="24" width="8" height="4" rx="1" fill="#6F89A8"/>`,
    drink: `<path d="M20 10h8l2 4-3 4v24a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V18l-3-4z" fill="#F0984A"/><rect x="19" y="20" width="10" height="12" fill="#FBC87E"/><circle cx="36" cy="30" r="9" fill="#C68A52"/><circle cx="33" cy="27" r="1.6" fill="#8A5A2E"/><circle cx="38" cy="25" r="1.6" fill="#8A5A2E"/><circle cx="39" cy="31" r="1.6" fill="#8A5A2E"/><circle cx="34" cy="33" r="1.6" fill="#8A5A2E"/>`,
    life: `<path d="M16 18h8l1 4v20a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V22z" fill="#9A7FC4"/><rect x="18" y="12" width="4" height="6" rx="1" fill="#7A5FA4"/><path d="M31 22h9l1 4v16a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V26z" fill="#7BB8D8"/><rect x="33" y="17" width="5" height="5" rx="1" fill="#5A98B8"/>`,
    etc: `<rect x="12" y="14" width="15" height="20" rx="2" fill="#F4C84B"/><path d="M15 19h9M15 23h9M15 27h6" stroke="#C89830" stroke-width="1.6" stroke-linecap="round"/><rect x="29" y="22" width="16" height="12" rx="6" fill="#F2F4F2" stroke="#C8CCC4" stroke-width="1.6"/><circle cx="34" cy="28" r="3" fill="#D8DCD4"/><circle cx="41" cy="28" r="3" fill="#D8DCD4"/>`,
  };

  const catGrid = document.getElementById('catGrid');
  CATEGORIES.forEach((c) => {
    const a = document.createElement('a');
    a.className = 'cat-card cat-card--' + c.color;
    a.href = 'result.html?cat=' + c.id;
    a.innerHTML = `
      <div class="c-icon"><svg viewBox="0 0 56 56">${CAT_ICONS[c.color] || ''}</svg></div>
      <div class="c-name">${c.name}</div>
      <span class="c-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </span>
    `;
    catGrid.appendChild(a);
  });

  function renderRecent() {
    const row = document.getElementById('recentRow');
    const recent = getRecentSearches();
    row.innerHTML = '';
    if (recent.length === 0) {
      row.innerHTML = '<p style="color:var(--text-sub);font-size:.9rem;">최근 검색한 상품이 없어요.</p>';
      return;
    }
    recent.forEach((term) => {
      const btn = document.createElement('a');
      btn.className = 'recent-chip';
      btn.href = 'result.html?q=' + encodeURIComponent(term);
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>${term}</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      `;
      row.appendChild(btn);
    });
  }
  renderRecent();

  document.getElementById('clearRecentBtn').addEventListener('click', () => {
    clearRecentSearches();
    renderRecent();
  });

  document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('searchInput').value.trim();
    if (!val) return;
    window.location.href = 'result.html?q=' + encodeURIComponent(val);
  });

  initMic(document.getElementById('searchMic'), (text) => {
    document.getElementById('searchInput').value = text;
    window.location.href = 'result.html?q=' + encodeURIComponent(text);
  });
</script>
</body>
</html>

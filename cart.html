<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cart - 장바구니</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
<div class="page">

  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="history.back()" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-group">
        <h1>장바구니</h1>
        <p data-tts-sub>담은 상품을 확인하고 결제를 준비하세요.</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="pill-btn font-toggle-btn">가+ 글자 크게</button>
      <button class="icon-btn tts-btn" aria-label="읽어주기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>
  </div>

  <div class="cart-layout">
    <div id="cartItems"></div>
    <div class="card summary-box">
      <h3>총 금액</h3>
      <div id="summaryLines"></div>
      <hr class="summary-divider">
      <div class="summary-total"><span>총 합계</span><span id="summaryTotal">0원</span></div>
      <a class="add-more-btn" href="search.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        상품 더 담기
      </a>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    홈
  </a>
  <a class="nav-btn" href="checklist.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    리스트
  </a>
</nav>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/common.js"></script>
<script>
  function render() {
    const cart = getCart();
    const itemsEl = document.getElementById('cartItems');
    const linesEl = document.getElementById('summaryLines');

    if (cart.length === 0) {
      itemsEl.innerHTML = `
        <div class="card empty-state">
          <div class="e-emoji">🛒</div>
          <p>장바구니가 비어 있어요.</p>
          <br>
          <a class="pill-btn active" href="search.html" style="display:inline-flex;">상품 담으러 가기</a>
        </div>
      `;
      linesEl.innerHTML = '<p style="color:var(--text-sub);font-size:.85rem;">담은 상품이 없어요.</p>';
      document.getElementById('summaryTotal').textContent = '0원';
      return;
    }

    itemsEl.innerHTML = '';
    linesEl.innerHTML = '';

    cart.forEach((c) => {
      const p = getProduct(c.id);
      if (!p) return;

      const item = document.createElement('div');
      item.className = 'card cart-item';
      item.innerHTML = `
        <div class="product-thumb">${productThumb(p)}</div>
        <div class="ci-info">
          <h4>${p.name}</h4>
          <div class="ci-meta">${p.volume}</div>
          <div class="ci-price">${formatPrice(p.price)}</div>
        </div>
        <div class="qty-control">
          <button class="qty-minus" data-id="${p.id}">−</button>
          <span class="qty-val">${c.qty}</span>
          <button class="qty-plus" data-id="${p.id}">+</button>
        </div>
        <button class="del-btn" data-id="${p.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          삭제
        </button>
      `;
      itemsEl.appendChild(item);

      const line = document.createElement('div');
      line.className = 'summary-line';
      line.innerHTML = `
        <div class="s-thumb">${productThumb(p)}</div>
        <span class="s-name">${p.name} ${p.volume} × ${c.qty}</span>
        <span class="s-price">${formatPrice(p.price * c.qty)}</span>
      `;
      linesEl.appendChild(line);
    });

    document.getElementById('summaryTotal').textContent = formatPrice(cartTotal());

    itemsEl.querySelectorAll('.qty-plus').forEach((b) => b.addEventListener('click', () => { updateCartQty(b.dataset.id, 1); render(); }));
    itemsEl.querySelectorAll('.qty-minus').forEach((b) => b.addEventListener('click', () => { updateCartQty(b.dataset.id, -1); render(); }));
    itemsEl.querySelectorAll('.del-btn').forEach((b) => b.addEventListener('click', () => { removeFromCart(b.dataset.id); render(); }));
  }

  render();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Cart - 상품 찾기</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="search">
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <button
            class="back-btn"
            onclick="history.back()"
            aria-label="뒤로가기"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="title-group">
            <h1>상품 찾기</h1>
            <p data-tts-sub>원하는 상품을 검색하거나, 음성으로 말씀해보세요.</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="pill-btn font-toggle-btn">가+ 글자 크게</button>
          <button class="icon-btn tts-btn" aria-label="읽어주기">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
              />
            </svg>
          </button>
        </div>
      </div>

      <form class="card search-box" id="searchForm">
        <svg
          class="search-ic"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="찾는 상품을 말씀하거나 입력하세요."
          autocomplete="off"
        />
        <button type="button" class="mic-circle" id="searchMic">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </button>
      </form>

      <div class="section-head">
        <h2>자주 찾는 상품</h2>
        <a class="link" href="result.html?cat=all">전체 보기 ></a>
      </div>
      <div class="cat-grid" id="catGrid"></div>

      <div class="section-head">
        <h2>최근 검색어</h2>
        <button
          class="link"
          id="clearRecentBtn"
          style="
            border: none;
            background: none;
            display: flex;
            align-items: center;
            gap: 4px;
          "
        >
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          </svg>
          전체삭제
        </button>
      </div>
      <div class="recent-row" id="recentRow"></div>
    </div>

    <nav class="bottom-nav">
      <a class="nav-btn" href="index.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        홈
      </a>
      <a class="nav-btn" href="checklist.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3" y1="6" x2="3.01" y2="6" />
          <line x1="3" y1="12" x2="3.01" y2="12" />
          <line x1="3" y1="18" x2="3.01" y2="18" />
        </svg>
        리스트
      </a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/common.js"></script>
    <script>
      const catGrid = document.getElementById("catGrid");
      CATEGORIES.forEach((c) => {
        const a = document.createElement("a");
        a.className = "cat-card";
        a.href = "result.html?cat=" + c.id;
        a.innerHTML = `<div class="c-emoji">${c.emoji}</div><div class="c-name">${c.name}</div>`;
        catGrid.appendChild(a);
      });

      function renderRecent() {
        const row = document.getElementById("recentRow");
        const recent = getRecentSearches();
        row.innerHTML = "";
        if (recent.length === 0) {
          row.innerHTML =
            '<p style="color:var(--text-sub);font-size:.9rem;">최근 검색한 상품이 없어요.</p>';
          return;
        }
        recent.forEach((term) => {
          const btn = document.createElement("a");
          btn.className = "recent-chip";
          btn.href = "result.html?q=" + encodeURIComponent(term);
          btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>${term}</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      `;
          row.appendChild(btn);
        });
      }
      renderRecent();

      document
        .getElementById("clearRecentBtn")
        .addEventListener("click", () => {
          clearRecentSearches();
          renderRecent();
        });

      document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const val = document.getElementById("searchInput").value.trim();
        if (!val) return;
        window.location.href = "result.html?q=" + encodeURIComponent(val);
      });

      initMic(document.getElementById("searchMic"), (text) => {
        document.getElementById("searchInput").value = text;
        window.location.href = "result.html?q=" + encodeURIComponent(text);
      });
    </script>
  </body>
</html>

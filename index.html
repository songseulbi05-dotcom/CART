<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Cart - 홈</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home">
    <div class="page">
      <div class="topbar">
        <div class="logo-row">
          <div class="logo-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              />
            </svg>
          </div>
          <div class="title-group">
            <h1 style="font-size: 1.3rem">Smart Cart</h1>
            <p>AI와 함께하는 편리한 장보기</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="pill-btn font-toggle-btn">가+ 글자 크게</button>
          <button class="icon-btn tts-btn" aria-label="읽어주기">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="greeting-row">
        <div class="greeting-text">
          <h2>안녕하세요, 고객님</h2>
          <p data-tts-sub>오늘도 편안한 장보기를 도와드릴게요.</p>
        </div>
        <div class="avatar-wrap">
          <div class="speech-bubble">
            필요한 것이 있으시면 언제든지 말씀해 주세요!
          </div>
          <div class="avatar-emoji">🧑‍🦳</div>
        </div>
      </div>

      <button class="card voice-search" id="homeVoiceBtn">
        <div class="mic-circle" id="homeMic">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </div>
        <div>
          <p class="vs-title">무엇을 찾으세요?</p>
          <p class="vs-sub">"우유 어디있어?"라고 말해보세요.</p>
        </div>
        <svg
          class="chev"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="22"
          height="22"
        >
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>

      <div class="menu-grid">
        <a class="card menu-card c-search" href="search.html">
          <div class="m-icon">🔍</div>
          <h3>상품 찾기</h3>
          <p>원하는 상품을<br />검색해보세요</p>
          <svg
            class="chev"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <path d="M9 18l6-6-6-6" />
          </svg>
        </a>
        <a class="card menu-card c-store" href="store.html">
          <div class="m-icon">📍</div>
          <h3>매장 안내</h3>
          <p>상품 위치까지<br />길을 안내해 드려요</p>
          <svg
            class="chev"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <path d="M9 18l6-6-6-6" />
          </svg>
        </a>
        <a class="card menu-card c-compare" href="result.html">
          <div class="m-icon">✨</div>
          <h3>상품 비교</h3>
          <p>비슷한 상품의<br />가격과 정보를 비교해요</p>
          <svg
            class="chev"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <path d="M9 18l6-6-6-6" />
          </svg>
        </a>
        <a class="card menu-card c-cart" href="cart.html">
          <div class="m-icon">🛒</div>
          <h3>장바구니</h3>
          <p>담은 상품과<br />금액을 확인해요</p>
          <svg
            class="chev"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <path d="M9 18l6-6-6-6" />
          </svg>
        </a>
      </div>

      <button class="stop-btn" id="stopBtn">
        <h3>긴급 정지 (STOP)</h3>
        <p>
          위험하거나 카트를 멈추고 싶은 경우 이 버튼을 누르시면 카트를 즉시 멈출
          수 있어요.
        </p>
      </button>
    </div>

    <nav class="bottom-nav">
      <a class="nav-btn active" href="index.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        홈
      </a>
      <a class="nav-btn" href="checklist.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3" y1="6" x2="3.01" y2="6" />
          <line x1="3" y1="12" x2="3.01" y2="12" />
          <line x1="3" y1="18" x2="3.01" y2="18" />
        </svg>
        리스트
      </a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/common.js"></script>
    <script>
      seedCartOnce();

      initMic(document.getElementById("homeVoiceBtn"), (text) => {
        window.location.href = "result.html?q=" + encodeURIComponent(text);
      });

      document.getElementById("stopBtn").addEventListener("click", () => {
        alert(
          "🛑 카트가 긴급 정지되었습니다.\n안전을 확인한 후 다시 이용해주세요.",
        );
      });
    </script>
  </body>
</html>

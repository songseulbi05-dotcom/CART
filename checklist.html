<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Cart - 장보기 체크리스트</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="checklist">
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <button
            class="back-btn"
            onclick="history.back()"
            aria-label="뒤로가기"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="title-group">
            <h1>장보기 체크리스트</h1>
            <p data-tts-sub>필요한 상품을 확인하고 하나씩 체크해보세요.</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="pill-btn font-toggle-btn">가+ 글자 크게</button>
          <button class="icon-btn tts-btn" aria-label="읽어주기">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path
                d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="checklist-layout">
        <div class="card checklist-col">
          <h3>남은 상품 <span class="count" id="remainCount">0</span>개</h3>
          <p class="col-sub">
            아직 담지 않은 상품이에요. 동그라미를 누르면 바로 담겨요.
          </p>
          <div id="remainList"></div>
        </div>
        <div class="card checklist-col added">
          <h3>담은 상품 <span class="count" id="addedCount">0</span>개</h3>
          <p class="col-sub">이미 장바구니에 담은 상품이에요.</p>
          <div id="addedList"></div>
        </div>
      </div>

      <div class="card progress-bar-card">
        <div class="pb-left">
          <div class="robot">🤖</div>
          <div>
            <h4 id="progressTitle">6개 중 0개를 담았어요!</h4>
            <p id="progressSub">아직 6개의 상품이 남아 있어요.</p>
          </div>
        </div>
        <a href="search.html">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          남은 상품 찾기
        </a>
      </div>
    </div>

    <nav class="bottom-nav">
      <a class="nav-btn" href="index.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        홈
      </a>
      <a class="nav-btn active" href="checklist.html">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3" y1="6" x2="3.01" y2="6" />
          <line x1="3" y1="12" x2="3.01" y2="12" />
          <line x1="3" y1="18" x2="3.01" y2="18" />
        </svg>
        리스트
      </a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/common.js"></script>
    <script>
      function render() {
        const cartIds = getCart().map((c) => c.id);
        const remaining = CHECKLIST_IDS.filter((id) => !cartIds.includes(id));
        const added = CHECKLIST_IDS.filter((id) => cartIds.includes(id));

        document.getElementById("remainCount").textContent = remaining.length;
        document.getElementById("addedCount").textContent = added.length;

        const remainList = document.getElementById("remainList");
        remainList.innerHTML = "";
        remaining.forEach((id) => {
          const p = getProduct(id);
          const row = document.createElement("div");
          row.className = "check-item";
          row.innerHTML = `
        <button class="check-circle" data-id="${id}" aria-label="담기"></button>
        <div class="product-thumb">${p.emoji}</div>
        <div class="ci-text"><h4>${p.name}</h4><p>${p.volume}</p></div>
        <a class="ci-action" href="result.html?q=${encodeURIComponent(p.name)}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          상품 찾기
        </a>
      `;
          remainList.appendChild(row);
        });
        if (remaining.length === 0) {
          remainList.innerHTML =
            '<p style="color:var(--text-sub);font-size:.9rem;">모두 담았어요! 👏</p>';
        }

        const addedList = document.getElementById("addedList");
        addedList.innerHTML = "";
        added.forEach((id) => {
          const p = getProduct(id);
          const row = document.createElement("div");
          row.className = "check-item done";
          row.innerHTML = `
        <button class="check-circle" data-id="${id}" aria-label="빼기">✓</button>
        <div class="product-thumb">${p.emoji}</div>
        <div class="ci-text"><h4>${p.name}</h4><p>${p.volume}</p></div>
        <a class="ci-action" href="cart.html">장바구니 보기 ></a>
      `;
          addedList.appendChild(row);
        });
        if (added.length === 0) {
          addedList.innerHTML =
            '<p style="color:var(--text-sub);font-size:.9rem;">아직 담은 상품이 없어요.</p>';
        }

        document.getElementById("progressTitle").textContent =
          `${CHECKLIST_IDS.length}개 중 ${added.length}개를 담았어요!`;
        document.getElementById("progressSub").textContent =
          remaining.length > 0
            ? `아직 ${remaining.length}개의 상품이 남아 있어요.`
            : "모든 상품을 담았어요. 결제를 진행해보세요!";

        document.querySelectorAll(".check-circle").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            if (isInCart(id)) {
              removeFromCart(id);
            } else {
              addToCart(id, 1);
            }
            render();
          });
        });
      }

      render();
    </script>
  </body>
</html>
